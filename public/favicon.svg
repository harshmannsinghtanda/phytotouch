<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="1"/>
    </radialGradient>

    <!-- Bio-Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Acoustic Wave Cyan Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 432Hz Solar Gold Resonance Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Circular Chassis -->
  <rect width="512" height="512" rx="112" fill="#070b12"/>
  <circle cx="256" cy="256" r="236" fill="url(#bgGlow)" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Concentric Acoustic Resonator Rings (Soundwaves) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="3 9"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Left Half: Organic Foliar Leaf Blade -->
  <g filter="url(#neonGlow)">
    <!-- Main Left Lamina -->
    <path d="M 256,76 C 256,76 130,130 118,252 C 108,354 186,418 256,436 C 256,436 256,76 256,76 Z" 
          fill="url(#leafGrad)" fill-opacity="0.92"/>

    <!-- Left Foliar Lateral Secondary Veins -->
    <path d="M 256,150 Q 190,175 152,210" fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 256,215 Q 180,245 138,290" fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 256,280 Q 190,315 156,360" fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 256,345 Q 215,375 192,408" fill="none" stroke="#064e3b" stroke-width="3.0" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Right Half: Acoustic Harmonic Synthesizer Waves (Mirroring leaf contours into soundwaves) -->
  <g filter="url(#neonGlow)">
    <!-- Soundwave Arc 1 (Outer Harmonics) -->
    <path d="M 256,92 C 330,120 388,185 392,260 C 396,335 342,398 256,420" 
          fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Soundwave Arc 2 (Mid Frequency Band - 432 Hz) -->
    <path d="M 256,140 C 310,165 352,210 354,262 C 356,316 318,362 256,380" 
          fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 8"/>

    <!-- Soundwave Arc 3 (Inner Solfeggio Core) -->
    <path d="M 256,188 C 292,205 316,234 318,264 C 320,296 296,326 256,340" 
          fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Bio-Frequency Node Dots (Synthesizer Saptak Taps) -->
    <circle cx="392" cy="260" r="8" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="354" cy="262" r="7" fill="#34d399" filter="url(#neonGlow)"/>
    <circle cx="318" cy="264" r="6" fill="#f59e0b" filter="url(#neonGlow)"/>
    
    <!-- Secondary Harmonic Pips -->
    <circle cx="356" cy="180" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="320" cy="210" r="4.5" fill="#34d399" opacity="0.8"/>
    <circle cx="350" cy="340" r="5" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Central Xylem / Bio-Capacitive Electrode Stem -->
  <g filter="url(#softGlow)">
    <!-- Central Electrode Midrib -->
    <path d="M 256,64 L 256,448" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <!-- Gold Tip Electrode Contact Pad -->
    <circle cx="256" cy="64" r="10" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Ground Probe Node at Base -->
    <circle cx="256" cy="448" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Interactive Tactile Touch Ripple (The "Touch" Transduction Moment) -->
  <g filter="url(#neonGlow)">
    <circle cx="256" cy="256" r="24" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.9"/>
    <circle cx="256" cy="256" r="14" fill="url(#goldGrad)"/>
    <circle cx="256" cy="256" r="5" fill="#ffffff"/>
  </g>

  <!-- Subtitle Tagline in Curved Track (Optional Microprint) -->
  <text x="256" y="488" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="4">
    432 HZ • BIO-ACOUSTIC TELEMETRY
  </text>
</svg>
